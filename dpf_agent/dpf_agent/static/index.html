<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="9TK9iVKUt3CbNChUgTyhzS">
<head data-page-node-id="AXSemhWbEGdExOkWLHETfh">
  <meta charset="UTF-8" data-page-node-id="DB8MuE0rq7e8M5CsfHzvQK" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="1qJ2ymbwDYUXhAYliEZKA8" />
  <title>天枢一号</title>
  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #f9f9f9;
      --hover: #ececec;
      --text: #343541;
      --muted: #6e6e80;
      --primary: #10a37f;
      --primary-dark: #0e8c6b;
      --border: #d9d9e3;
      --radius: 16px;
      --shadow: 0 0 12px rgba(0,0,0,0.06);
      --msg-user: #f7f7f8;
      --msg-assistant: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden;
    }
    .app { display: flex; height: 100vh; }

    /* 左侧边栏 */
    .sidebar {
      width: 260px; min-width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 14px 12px;
    }
    .new-chat-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .new-chat-btn:hover { background: var(--hover); }
    .sessions { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
    .session-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      margin-bottom: 4px;
      display: flex; justify-content: space-between; align-items: center;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .session-item:hover { background: var(--hover); }
    .session-item.active { background: #e3e3e8; }
    .session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .session-del {
      opacity: 0; cursor: pointer; color: var(--muted); padding: 0 4px;
    }
    .session-item:hover .session-del { opacity: 1; }
    .session-del:hover { color: #c00; }
    .sidebar-footer {
      padding: 12px;
      font-size: 0.78rem; color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* 主区域 */
    .main {
      flex: 1; display: flex; flex-direction: column;
      position: relative;
    }
    .topbar {
      height: 50px; display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid var(--border); font-weight: 600; font-size: 1rem;
      background: var(--bg);
    }

    .content {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
      padding-bottom: 180px;
      scroll-padding-bottom: 180px;
    }

    /* 欢迎页 */
    .welcome {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .welcome h1 { margin: 0 0 32px; font-size: 2rem; font-weight: 500; }
    .examples {
      display: grid; grid-template-columns: repeat(2, minmax(220px, 280px)); gap: 12px;
    }
    .example {
      border: 1px solid var(--border); border-radius: 12px; padding: 16px;
      cursor: pointer; font-size: 0.95rem; color: var(--text);
      transition: box-shadow .15s, transform .15s;
    }
    .example:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

    /* 消息流 */
    .messages { flex: 1; padding: 20px 0 40px; }
    .msg-row {
      padding: 18px 16%; display: flex; gap: 18px;
    }
    .msg-row.user { background: var(--msg-user); }
    .msg-row.assistant { background: var(--msg-assistant); border-bottom: 1px solid #f0f0f0; }
    .avatar {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
    }
    .avatar.user { background: #10a37f; color: #fff; }
    .avatar.assistant { background: #e0e0e0; color: #333; }
    .msg-body { flex: 1; line-height: 1.65; white-space: pre-wrap; }
    .msg-body p { margin: 0 0 8px; }
    .msg-body ul { margin: 4px 0; padding-left: 20px; }
    .msg-meta { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
    .msg-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .msg-actions a, .msg-actions button {
      font-size: 0.85rem; color: var(--primary); text-decoration: none;
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 10px; cursor: pointer;
    }
    .msg-actions a:hover, .msg-actions button:hover { background: #f0faf7; }

    /* 输入区 */
    .input-area {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(255,255,255,1) 70%, rgba(255,255,255,0));
      padding: 20px 16% 28px;
    }
    .input-box {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); box-shadow: var(--shadow);
      display: flex; flex-direction: column;
    }
    .input-box textarea {
      width: 100%; min-height: 56px; max-height: 220px;
      border: none; outline: none; resize: none;
      padding: 14px 16px 0; font-size: 1rem; line-height: 1.5;
      font-family: inherit; background: transparent;
    }
    .input-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px 10px;
    }
    .input-tools { display: flex; gap: 8px; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--muted);
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .send-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--primary); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover { background: var(--primary-dark); }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }

    .hint { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

    .attachment-chips {
      display: none; align-items: center; flex-wrap: wrap; gap: 8px;
      padding: 0 12px 10px; max-width: 100%;
    }
    .attachment-chips.has-files { display: flex; }
    .attachment-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #f0f0f5; border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 8px; font-size: 0.85rem; color: var(--text); max-width: 240px;
    }
    .attachment-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-chip button {
      border: none; background: transparent; cursor: pointer; color: var(--muted);
      font-size: 0.9rem; line-height: 1; padding: 0 2px;
    }
    .attachment-chip button:hover { color: #c00; }
    .msg-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid #ddd; border-top-color: var(--primary);
      border-radius: 50%; animation: spin .8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 10px 18px; border-radius: 8px;
      font-size: 0.9rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 900px) {
      .sidebar { position: absolute; left: -260px; z-index: 10; height: 100%; transition: left .2s; }
      .sidebar.open { left: 0; }
      .msg-row { padding: 14px 5%; }
      .input-area { padding: 14px 5% 20px; }
    }
  </style>
</head>
<body data-page-node-id="khGw1nCfawPWy7asYCsbit">
  <div class="app" data-page-node-id="eRZyaluxvJLmsAfisCqZXf">
    <aside class="sidebar" id="sidebar" data-page-node-id="2je2vwRk7BEmYWoFckgEHb">
      <div class="sidebar-header" data-page-node-id="s4LGuOkFTHtYbqzwxNW0u1">
        <button class="new-chat-btn" onclick="newSession()" data-page-node-id="CXmW2BdbMhSGSPE9RaZHYD">
          <span data-page-node-id="qQsV16xog7BhnkrT3TXE4R">+</span> 新聊天
        </button>
      </div>
      <div class="sessions" id="sessions" data-page-node-id="mssIvLCGDHpeopKjj5CD7S"></div>
      <div class="sidebar-footer" data-page-node-id="bxGURI9UrZRPFRNVNjomp7">天枢一号 V1.3</div>

    <main class="main" data-page-node-id="3WorcDq6iCJFirfqXb8ez5">
      <div class="topbar" data-page-node-id="0vRdtc15IChc9JEATmSIob">天枢一号</div>

        <div class="welcome" id="welcome" data-page-node-id="E4SDAyveCj7uc5x7QKlVFN">

            <div class="example" onclick="setInput('帮我跑一下 case_tx 算例，输出 HTML 报告')" data-page-node-id="Cl5jhQfYg1lI9sB4b0LqGV">跑 case_tx 算例，输出 HTML 报告</div>
            <div class="example" onclick="setInput('上传了一个配电网算例，帮我计算')" data-page-node-id="UM81p9vlXlHocnBhkL3EbO">上传算例并执行潮流计算</div>

              <button class="icon-btn" title="上传算例文件（可多选或上传 zip）" onclick="document.getElementById('fileInput').click()" data-page-node-id="eRkkW4ozDmjYupDD1qqsZH">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" data-page-node-id="pwA4GbPSXiLpsT504kyd27"><path d="M21.2 15c.7-1.2 1-2.5.7-3.9-.6-2.5-2.7-4.3-5.2-4.6-1.4-2.1-3.8-3.4-6.5-3.4-4.1 0-7.5 3-8 7-2.8.6-4.9 3.1-4.9 6 0 3.3 2.7 6 6 6h13c2.8 0 5-2.2 5-5 0-2.6-2.1-4.8-4.7-5.1z" data-page-node-id="0DbesOBxkmRzVdm1pm6w1t"/></svg>
              </button>

            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled data-page-node-id="FzR15LTN9JSzG9vvgALE0K">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" data-page-node-id="JsPJ3GyES0rrwgOMpnAcha"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" data-page-node-id="5z2yBkhTSV7leOXFinFfUX"/></svg>

          </div>
        </div>
        <div class="hint" data-page-node-id="eaObQ7aXjULfAMaOjuk2N0">数值结果来自 OpenDSS，仅作仿真参考，不作为工程调度依据。</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" data-page-node-id="Kj6vYzS60uNegbCAOq4YjM"></div>

  <script>
    let currentSessionId = null;
    let isSending = false;
    let pendingFiles = [];

    async function api(path, opts={}) {
      const res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
      if (!res.ok) {
        const data = await res.json().catch(()=>({}));
        throw new Error(data.detail || `请求失败 ${res.status}`);
      }
      return res.json();
    }

    function toast(text) {
      const t = document.getElementById('toast');
      t.textContent = text; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function loadSessions() {
      const data = await api('/api/chat/sessions');
      const list = document.getElementById('sessions');
      list.innerHTML = '';
      data.sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
        div.innerHTML = `<span class="session-title">${escapeHtml(s.title)}</span><span class="session-del" title="删除">×</span>`;
        div.querySelector('.session-title').onclick = () => openSession(s.id);
        div.querySelector('.session-del').onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
        list.appendChild(div);
      });
    }

    async function newSession() {
      const s = await api('/api/chat/sessions', {method:'POST', body:JSON.stringify({title:'新聊天'})});
      currentSessionId = s.id;
      await loadSessions();
      showEmpty();
      document.getElementById('input').focus();
    }

    async function openSession(id) {
      currentSessionId = id;
      const s = await api(`/api/chat/sessions/${id}`);
      await loadSessions();
      renderMessages(s.messages || []);
    }

    async function deleteSession(id) {
      if (!confirm('确定删除这个聊天？')) return;
      await api(`/api/chat/sessions/${id}`, {method:'DELETE'});
      if (currentSessionId === id) { currentSessionId = null; showEmpty(); }
      await loadSessions();
    }

    function showEmpty() {
      document.getElementById('welcome').style.display = 'flex';
      document.getElementById('messages').style.display = 'none';
      document.getElementById('messages').innerHTML = '';
    }

    function renderMessages(messages) {
      const welcome = document.getElementById('welcome');
      const box = document.getElementById('messages');
      if (!messages.length) { showEmpty(); return; }
      welcome.style.display = 'none';
      box.style.display = 'block';
      box.innerHTML = '';
      messages.forEach(m => box.appendChild(buildMessageEl(m)));
      box.scrollTop = box.scrollHeight;
    }

    function buildMessageEl(m) {
      const row = document.createElement('div');
      row.className = `msg-row ${m.role}`;
      const avatar = document.createElement('div');
      avatar.className = `avatar ${m.role}`;
      avatar.textContent = m.role === 'user' ? '你' : 'AI';
      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML = formatContent(m.content);
      if (m.attachments && m.attachments.length) {
        const attWrap = document.createElement('div');
        attWrap.className = 'msg-attachments';
        m.attachments.forEach(a => {
          const chip = document.createElement('div');
          chip.className = 'attachment-chip';
          chip.innerHTML = `<span>${escapeHtml(a.filename || '附件')}</span>`;
          attWrap.appendChild(chip);
        });
        body.appendChild(attWrap);
      }
      if (m.role === 'assistant') {
        if (m.task_id) {
          const meta = document.createElement('div');
          meta.className = 'msg-meta';
          meta.textContent = `任务 ${m.task_id} · ${m.task_status || 'running'}`;
          body.appendChild(meta);
        }
        if (m.report_url || Object.keys(m.artifacts || {}).length) {
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          if (m.report_url) {
            const a = document.createElement('a');
            a.href = m.report_url; a.target = '_blank'; a.textContent = '查看 HTML 报告';
            actions.appendChild(a);
          }
          if (m.artifacts && m.artifacts['powerflow_result.json']) {
            const a = document.createElement('a');
            a.href = m.artifacts['powerflow_result.json']; a.textContent = '下载结果 JSON';
            actions.appendChild(a);
          }
          body.appendChild(actions);
        }
      }
      row.appendChild(avatar); row.appendChild(body);
      return row;
    }

    function formatContent(text) {
      if (!text) return '';
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function escapeHtml(s) {
      const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
    }

    function setInput(text) {
      const input = document.getElementById('input');
      input.value = text; input.focus(); autoResize(input);
    }

    function updateSendButton() {
      const hasText = document.getElementById('input').value.trim().length > 0;
      document.getElementById('sendBtn').disabled = (!hasText && pendingFiles.length === 0) || isSending;
    }

    function autoResize(t) {
      t.style.height = 'auto';
      t.style.height = Math.min(t.scrollHeight, 220) + 'px';
      updateSendButton();
    }

    document.getElementById('input').addEventListener('input', function(){ autoResize(this); });
    document.getElementById('input').addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    async function sendMessage() {
      if (!currentSessionId) await newSession();
      const input = document.getElementById('input');
      const text = input.value.trim();
      if ((!text && pendingFiles.length === 0) || isSending) return;

      isSending = true;
      const btn = document.getElementById('sendBtn');
      const oldIcon = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;

      // 组装 FormData：文字 + 文件一起提交
      const form = new FormData();
      form.append('content', text);
      const filesSnapshot = pendingFiles.slice();
      pendingFiles.forEach(f => form.append('files', f));

      // 乐观渲染用户消息（文字与附件在同一个气泡）
      const welcome = document.getElementById('welcome');
      const box = document.getElementById('messages');
      if (welcome.style.display !== 'none') { welcome.style.display = 'none'; box.style.display = 'block'; }
      const userMsg = {role:'user', content:text, task_id:null, artifacts:{}, attachments: filesSnapshot.map(f => ({filename: f.name}))};
      box.appendChild(buildMessageEl(userMsg));
      const placeholder = document.createElement('div');
      placeholder.className = 'msg-row assistant';
      placeholder.innerHTML = '<div class="avatar assistant">AI</div><div class="msg-body"><span class="spinner"></span> 正在计算...</div>';
      box.appendChild(placeholder);
      box.scrollTop = box.scrollHeight;
      input.value = ''; autoResize(input);
      pendingFiles = [];
      renderAttachmentChips();

      try {
        const res = await fetch(`/api/chat/sessions/${currentSessionId}/messages`, {method: 'POST', body: form});
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `请求失败 ${res.status}`);
        placeholder.remove();
        box.appendChild(buildMessageEl(data.assistant_message));
      } catch (err) {
        placeholder.remove();
        const errMsg = {role:'assistant', content:`执行失败：${err.message}`, task_id:null, artifacts:{}};
        box.appendChild(buildMessageEl(errMsg));
        toast(err.message);
      } finally {
        isSending = false;
        btn.innerHTML = oldIcon;
        updateSendButton();
        box.scrollTop = box.scrollHeight;
        await loadSessions();
      }
    }

    function queueFiles(files) {
      if (!files || !files.length) return;
      for (const f of files) pendingFiles.push(f);
      renderAttachmentChips();
      updateSendButton();
      document.getElementById('input').focus();
    }

    function removePendingFile(idx) {
      pendingFiles.splice(idx, 1);
      renderAttachmentChips();
      updateSendButton();
    }

    function renderAttachmentChips() {
      const wrap = document.getElementById('attachmentChips');
      wrap.innerHTML = '';
      if (!pendingFiles.length) { wrap.classList.remove('has-files'); return; }
      pendingFiles.forEach((f, idx) => {
        const chip = document.createElement('div');
        chip.className = 'attachment-chip';
        chip.innerHTML = `<span>${escapeHtml(f.name)}</span><button title="移除">×</button>`;
        chip.querySelector('button').onclick = (e) => { e.stopPropagation(); removePendingFile(idx); };
        wrap.appendChild(chip);
      });
      wrap.classList.add('has-files');
    }

    async function uploadFiles(files) {
      // 保留旧入口：直接上传文件（不含文字），仍作为单独消息
      if (!files || !files.length) return;
      if (!currentSessionId) await newSession();
      const form = new FormData();
      for (const f of files) form.append('files', f);
      try {
        const res = await fetch(`/api/chat/sessions/${currentSessionId}/upload`, {method:'POST', body:form});
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '上传失败');
        toast(`已上传 ${data.message.attachments.length} 个文件`);
        await openSession(currentSessionId);
      } catch (err) {
        toast('上传失败：' + err.message);
      }
    }

    // 初始化
    (async function(){
      await loadSessions();
      const data = await api('/api/chat/sessions');
      if (data.sessions.length) {
        await openSession(data.sessions[0].id);
      } else {
        await newSession();
      }
    })();
  </script>
